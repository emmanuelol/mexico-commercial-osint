services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: mexico-commercial-osint:latest
    ports:
      - "8888:8888"
    volumes:
      - ./data:/app/data
      - ./notebooks:/app/notebooks
      - ./src:/app/src
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
